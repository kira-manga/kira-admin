# Draft only: the request is unauthorized and its Backend SHA is zero.
name: Backend11 focused completion-lease Redis validation (private)
'on':
  push:
    branches: [remediation/app-29-backend-complaints]
    paths: [ci/backend11-completion-leases.request.json]
permissions:
  contents: read
concurrency:
  group: backend11-private-completion-leases
  cancel-in-progress: false
jobs:
  completion-leases-redis:
    if: github.event.repository.private == true && github.repository == 'kira-manga/kira-admin' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the exact private carrier without persisted credentials
        timeout-minutes: 1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          path: admin
          persist-credentials: false
      - name: Require explicit primary authorization and an exact Backend11 commit
        id: target
        timeout-minutes: 1
        shell: bash
        run: |
          python3 -B - <<'PY'
          import json, os, re
          from pathlib import Path
          value = json.loads(Path('admin/ci/backend11-completion-leases.request.json').read_text())
          sha = value.get('backend_sha', '')
          if value.get('authorization') != 'BACKEND11_ONE_TARGETED_BATCH_AUTHORIZED' or not re.fullmatch('[0-9a-f]{40}', sha) or sha == '0' * 40:
              raise SystemExit('Unbound or unauthorized Backend11 request; no Backend checkout/build permitted')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('sha=' + sha + '\n')
          PY
      - name: Check out only the exact public Backend11 target
        timeout-minutes: 1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: kira-manga/Kira-backend
          ref: ${{ steps.target.outputs.sha }}
          path: backend
          persist-credentials: false
      - name: Set up the existing Java 21 toolchain
        timeout-minutes: 2
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run 31 completion-only cases with compilation, statics and the Lua witness once
        id: validation
        timeout-minutes: 28
        env:
          BACKEND11_RUN: ${{ runner.temp }}/backend11-completion-leases-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 -B admin/ci/backend11-completion-leases.py
      - name: Retain raw private reports; missing evidence is not a passing test result
        if: always() && steps.validation.outcome != 'skipped'
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend11-completion-leases-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backend11-completion-leases-${{ github.run_id }}-${{ github.run_attempt }}/reports/
          retention-days: 3
          if-no-files-found: error
