# UNBOUND AUTHOR COPY: source checkpoint is null and request disabled; no launch authorization.
# Retain the predecessor concurrency group; primary also holds the existing host-local batch.lock.
# No VM-side claim is made to that primary-host lock.
name: Backend22 signed-candidate export validation (private)
'on':
  push:
    branches: [remediation/app-29-backend-complaints]
    paths: [ci/backend20-atomic-bootstrap.request.json]
permissions:
  contents: read
concurrency:
  group: backend11-private-completion-leases
  cancel-in-progress: false
jobs:
  atomic-bootstrap-postgres:
    if: github.event.repository.private == true && github.repository == 'kira-manga/kira-admin' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the exact private carrier without persisted credentials
        timeout-minutes: 1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          path: admin
          persist-credentials: false
      - name: Require explicit primary EXPORT authorization and an exact Backend22 commit
        id: target
        timeout-minutes: 1
        shell: bash
        run: |
          python3 -B - <<'PY'
          import json, os, re
          from pathlib import Path
          expected_backend_sha = 'f6b118bef0b6380a1d40c23334b4d66b65f282ab'  # Exact independently reviewed source checkpoint.
          if (not isinstance(expected_backend_sha, str) or not re.fullmatch('[0-9a-f]{40}', expected_backend_sha) or
                  expected_backend_sha == '0' * 40):
              raise SystemExit('UNBOUND Backend22 export checkpoint; no Backend checkout/build permitted')
          value = json.loads(Path('admin/ci/backend20-atomic-bootstrap.request.json').read_text())
          sha = value.get('backend_sha', '')
          if (set(value) != {'authorization', 'authorized', 'runAllowed', 'backend_sha', 'classes', 'methods', 'status'} or
                  value.get('authorization') != 'BACKEND22_ONE_TARGETED_BATCH_AUTHORIZED' or
                  value.get('authorized') is not True or value.get('runAllowed') is not True or
                  value.get('status') != 'PRIMARY_BOUND_EXPORT' or
                  not isinstance(sha, str) or not re.fullmatch('[0-9a-f]{40}', sha) or sha == '0' * 40 or sha != expected_backend_sha):
              raise SystemExit('Disabled, wrong-phase or unbound Backend22 export request; no Backend checkout/build permitted')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('sha=' + sha + '\n')
          PY
      - name: Check out only the exact public Backend22 export target
        timeout-minutes: 1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: kira-manga/Kira-backend
          ref: ${{ steps.target.outputs.sha }}
          path: backend
          persist-credentials: false
      - name: Set up the existing Java 21 toolchain
        timeout-minutes: 2
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: "Run Backend22 export: 10 ordinary methods + 1 explicit export, compilation, statics and reference witness once"
        id: validation
        timeout-minutes: 28
        env:
          BACKEND20_RUN: ${{ runner.temp }}/backend20-atomic-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 -B admin/ci/backend20-atomic-bootstrap.py
      - name: Retain raw private reports; missing evidence is not a passing test result
        if: always() && steps.validation.outcome != 'skipped'
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend20-atomic-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backend20-atomic-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}/reports/
          retention-days: 3
          if-no-files-found: error
