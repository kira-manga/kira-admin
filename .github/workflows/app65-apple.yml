name: App65 isolated Apple resource validation (private, UNBOUND preparation)

on:
  push:
    branches: [remediation/app-29-backend-complaints]
    paths: [ci/app65-apple.request.json]

permissions:
  contents: read

concurrency:
  group: app65-private-apple-resources
  cancel-in-progress: false

jobs:
  resources:
    if: >-
      ${{ github.repository == 'kira-manga/kira-admin' && github.event.repository.private == true &&
          github.event_name == 'push' && github.ref == 'refs/heads/remediation/app-29-backend-complaints' &&
          github.run_attempt == 1 }}
    runs-on: macos-26
    timeout-minutes: 18
    steps:
      - name: Exact private carrier, no persisted credentials
        timeout-minutes: 2
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Require reviewed one-attempt source and tooling admission
        id: request
        timeout-minutes: 1
        run: python3 -B control/ci/app65-apple.py request
      - name: Exact issue source, no persisted credentials
        timeout-minutes: 2
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: kira-manga/kira-app
          ref: ${{ steps.request.outputs.source_sha }}
          path: app65-source
          persist-credentials: false
      # UNBOUND: primary must admit both tooling reviews and the exact source checkpoint.
      # In the same owned attempt: fixed XcodeGen + local locked REXML only, then the probe;
      # the recipe separately removes its fresh APP65_TOOLS after the final owned barrier.
      - name: Prepare pinned tools, generate real spec and build only the unsigned resource probe
        id: probe
        timeout-minutes: 13
        env:
          APP65_RUN: ${{ runner.temp }}/app65-apple-${{ github.run_id }}-${{ github.run_attempt }}
          APP65_TOOLS: ${{ runner.temp }}/app65-apple-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 -B control/ci/app65-apple.py run
      - name: Bounded private resource evidence, not a shipping artifact
        if: always() && steps.probe.outcome != 'skipped'
        timeout-minutes: 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app65-apple-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/app65-apple-${{ github.run_id }}-${{ github.run_attempt }}/upload/
          retention-days: 3
          if-no-files-found: error
