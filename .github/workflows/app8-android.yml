name: App8 Android diagnostic (public synthetic)

on:
  push:
    branches: [validation/app8-sdk-scaffold-20260915-01]
    paths: [ci/app8-android.request.json]

permissions:
  contents: read

concurrency:
  group: app8-android-public-synthetic-20260915
  cancel-in-progress: false

jobs:
  android-api26:
    if: >-
      ${{ github.repository == 'kira-manga/kira-admin' &&
          github.event.repository.private == false && github.event_name == 'push' &&
          github.ref == 'refs/heads/validation/app8-sdk-scaffold-20260915-01' &&
          github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: One public synthetic owned SDK-only API26 check
        id: native
        env:
          APP8_RUN: ${{ runner.temp }}/app8-android-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 -B ci/app8-android.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.native.outcome != 'skipped'
        with:
          name: app8-android-public-synthetic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/app8-android-${{ github.run_id }}-${{ github.run_attempt }}/reports/result.json
            ${{ runner.temp }}/app8-android-${{ github.run_id }}-${{ github.run_attempt }}/reports/native-summary.json
            ${{ runner.temp }}/app8-android-${{ github.run_id }}-${{ github.run_attempt }}/reports/source-bindings.json
            ${{ runner.temp }}/app8-android-${{ github.run_id }}-${{ github.run_attempt }}/reports/tool-identities.json
            ${{ runner.temp }}/app8-android-${{ github.run_id }}-${{ github.run_attempt }}/reports/runtime-profile.json
            ${{ runner.temp }}/app8-android-${{ github.run_id }}-${{ github.run_attempt }}/reports/isolation.json
            ${{ runner.temp }}/app8-android-${{ github.run_id }}-${{ github.run_attempt }}/reports/packages.json
            ${{ runner.temp }}/app8-android-${{ github.run_id }}-${{ github.run_attempt }}/reports/owned-intent.json
            ${{ runner.temp }}/app8-android-${{ github.run_id }}-${{ github.run_attempt }}/reports/namespace-membership.json
            ${{ runner.temp }}/app8-android-${{ github.run_id }}-${{ github.run_attempt }}/reports/preparation-children.json
            ${{ runner.temp }}/app8-android-${{ github.run_id }}-${{ github.run_attempt }}/reports/inside-children.json
            ${{ runner.temp }}/app8-android-${{ github.run_id }}-${{ github.run_attempt }}/reports/outside-children.json
            ${{ runner.temp }}/app8-android-${{ github.run_id }}-${{ github.run_attempt }}/reports/inside-commands.json
            ${{ runner.temp }}/app8-android-${{ github.run_id }}-${{ github.run_attempt }}/reports/allow-result.json
            ${{ runner.temp }}/app8-android-${{ github.run_id }}-${{ github.run_attempt }}/reports/deny-result.json
            ${{ runner.temp }}/app8-android-${{ github.run_id }}-${{ github.run_attempt }}/reports/005-no-host-ipc.log
            ${{ runner.temp }}/app8-android-${{ github.run_id }}-${{ github.run_attempt }}/reports/009-emulator-version.log
            ${{ runner.temp }}/app8-android-${{ github.run_id }}-${{ github.run_attempt }}/reports/*-allow-native.log
            ${{ runner.temp }}/app8-android-${{ github.run_id }}-${{ github.run_attempt }}/reports/*-deny-native.log
          retention-days: 3
          if-no-files-found: error
