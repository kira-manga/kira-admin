name: App8 copied-policy Android check (private)

on:
  push:
    branches: [remediation/app-29-backend-complaints]
    paths: [ci/app8-android.request.json]

permissions:
  contents: read

concurrency:
  group: app8-android-private
  cancel-in-progress: false

jobs:
  android-api26:
    if: >-
      ${{ github.repository == 'kira-manga/kira-admin' &&
          github.event.repository.private == true && github.event_name == 'push' &&
          github.ref == 'refs/heads/remediation/app-29-backend-complaints' &&
          github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: One owned SDK-only API26 check
        id: native
        env:
          APP8_RUN: ${{ runner.temp }}/app8-android-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 -B ci/app8-android.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.native.outcome != 'skipped'
        with:
          name: app8-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/app8-android-${{ github.run_id }}-${{ github.run_attempt }}/reports/*.json
            ${{ runner.temp }}/app8-android-${{ github.run_id }}-${{ github.run_attempt }}/reports/*.log
          retention-days: 3
          if-no-files-found: error
