# One primary-bound new source13.1 case plus exact-IT statics; no release or deployment.
name: Backend29 source13.1 restore PostgreSQL validation (private)
'on':
  push:
    branches: [remediation/app-29-backend-complaints]
    paths: [ci/backend29-backup-restore.request.json]
permissions:
  contents: read
concurrency:
  group: backend29-private-backup-restore
  cancel-in-progress: false
jobs:
  backup-restore-postgres:
    if: github.event.repository.private == true && github.repository == 'kira-manga/kira-admin' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 43
    steps:
      - name: Check out the exact private carrier without persisted credentials
        timeout-minutes: 1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          path: admin
          persist-credentials: false
      - name: Require explicit primary authorization and an exact Backend29 commit
        id: target
        timeout-minutes: 1
        shell: bash
        run: |
          python3 -B - <<'PY'
          import json, os, re
          from pathlib import Path
          value = json.loads(Path('admin/ci/backend29-backup-restore.request.json').read_text())
          sha = value.get('backend_sha', '')
          expected_class = 'me.manga.kira.backend.database.DatabaseBackupRestoreIT'
          expected_selector = expected_class + '.sourceThirteenOnePreservesCredentialsBeforeReleaseValidation'
          expected_file = 'src/test/kotlin/me/manga/kira/backend/database/DatabaseBackupRestoreIT.kt'
          expected_hash = '38295bfb332989f117ddbf4e9af25366ab093aa390ffc9ef2a84d10ee81ba975'
          fields = {'authorization', 'backend_sha', 'classes', 'selectors', 'static_files', 'status'}
          if (set(value) != fields or value.get('authorization') != 'BACKEND29_V13_1_ONE_CASE_AUTHORIZED'
                  or not re.fullmatch('[0-9a-f]{40}', sha) or sha != 'e2293085c062bf0610f328845b6bdfb4f4ae8eca'
                  or value.get('classes') != {expected_class: 1}
                  or type(value['classes'].get(expected_class)) is not int
                  or value.get('selectors') != [expected_selector]
                  or value.get('static_files') != {expected_file: expected_hash}):
              raise SystemExit('Unbound, broadened or unauthorized Backend29 v13.1 request; no Backend checkout/build permitted')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('sha=' + sha + '\n')
          PY
      - name: Check out only the exact public Backend29 target
        timeout-minutes: 1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: kira-manga/Kira-backend
          ref: ${{ steps.target.outputs.sha }}
          path: backend
          persist-credentials: false
      - name: Set up the existing Java 21 toolchain
        timeout-minutes: 2
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run only the source13.1 case and exact IT-file static checks once
        id: validation
        timeout-minutes: 35
        env:
          BACKEND29_RUN: ${{ runner.temp }}/backend29-backup-restore-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 -B admin/ci/backend29-backup-restore.py
      - name: Retain raw private reports; missing evidence is not a passing test result
        if: always() && steps.validation.outcome != 'skipped'
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend29-backup-restore-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backend29-backup-restore-${{ github.run_id }}-${{ github.run_attempt }}/reports/
          retention-days: 3
          if-no-files-found: error
