name: Reader Apple01 lower-module mains and existing VM Native11 (private UNBOUND)

on:
  push:
    branches: [remediation/app-29-backend-complaints]
    paths: [ci/reader-apple.request.json]

permissions:
  contents: read

concurrency:
  group: reader-private-apple01
  cancel-in-progress: false

jobs:
  apple01:
    if: >-
      ${{ github.repository == 'kira-manga/kira-admin' &&
          github.event.repository.private == true && github.event_name == 'push' &&
          github.ref == 'refs/heads/remediation/app-29-backend-complaints' &&
          github.run_attempt == 1 }}
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Exact private carrier, without persisted credentials
        timeout-minutes: 2
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Require separate primary source and public Native acquisition authorizations
        id: request
        timeout-minutes: 1
        run: python3 -B control/ci/reader-apple.py request
      - name: Exact reviewed public app source, without persisted credentials
        timeout-minutes: 2
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: kira-manga/kira-app
          ref: ${{ steps.request.outputs.source_sha }}
          path: reader-apple-source
          persist-credentials: false
      # JAVA_HOME_21_ARM64 must identify an already installed runner JDK21.
      # No setup-java, tool installation, shared cache or fallback step is included.
      - name: Normal both-target UI mains and owned-simulator presentation Native11, then clean
        id: test
        timeout-minutes: 25
        env:
          READER_APPLE_RUN: ${{ runner.temp }}/app-reader-apple01-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 -B control/ci/reader-apple.py test
      - name: Retain bounded private diagnostics, never source or KLIB/executable archives
        if: always() && steps.test.outcome != 'skipped'
        timeout-minutes: 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-reader-apple01-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/app-reader-apple01-${{ github.run_id }}-${{ github.run_attempt }}/reports/*.json
            ${{ runner.temp }}/app-reader-apple01-${{ github.run_id }}-${{ github.run_attempt }}/reports/*.log
            ${{ runner.temp }}/app-reader-apple01-${{ github.run_id }}-${{ github.run_attempt }}/reports/xml/*.xml
          retention-days: 3
          if-no-files-found: error
