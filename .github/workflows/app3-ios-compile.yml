name: App3 one-target iOS compilation (private)

on:
  push:
    branches: [remediation/app-29-backend-complaints]
    paths: [ci/app3-ios-compile.request.json]

permissions:
  contents: read

concurrency:
  group: app3-private-ios-compile
  cancel-in-progress: false

jobs:
  ios-compile:
    if: >-
      ${{ github.repository == 'kira-manga/kira-admin' &&
          github.event.repository.private == true && github.event_name == 'push' &&
          github.ref == 'refs/heads/remediation/app-29-backend-complaints' &&
          github.run_attempt == 1 }}
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Exact private carrier, without persisted credentials
        timeout-minutes: 2
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Require the primary's explicit one-attempt source binding
        id: request
        timeout-minutes: 1
        run: python3 -B control/ci/app3-ios-compile.py request
      - name: Exact reviewed public app source, without persisted credentials
        timeout-minutes: 2
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: kira-manga/kira-app
          ref: ${{ steps.request.outputs.source_sha }}
          path: app3-source
          persist-credentials: false
      - name: Existing pinned Java setup, without a shared dependency cache
        timeout-minutes: 2
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile only data remote's iOS simulator ARM klib, then stop and clean
        id: compile
        timeout-minutes: 25
        env:
          APP3_RUN: ${{ runner.temp }}/app3-ios-compile-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 -B control/ci/app3-ios-compile.py compile
      - name: Retain bounded private diagnostics, never source archives or klibs
        if: always() && steps.compile.outcome != 'skipped'
        timeout-minutes: 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app3-ios-compile-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/app3-ios-compile-${{ github.run_id }}-${{ github.run_attempt }}/reports/*.json
            ${{ runner.temp }}/app3-ios-compile-${{ github.run_id }}-${{ github.run_attempt }}/reports/*.log
          retention-days: 3
          if-no-files-found: error
