# One primary-bound targeted validation batch; no release or deployment.
name: Backend19 focused source-summary generation PostgreSQL validation (private)
'on':
  push:
    branches: [remediation/app-29-backend-complaints]
    paths: [ci/backend19-summary-generation.request.json]
permissions:
  contents: read
concurrency:
  group: backend19-private-summary-generation
  cancel-in-progress: false
jobs:
  source-summary-generation-postgres:
    if: github.event.repository.private == true && github.repository == 'kira-manga/kira-admin' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 43
    steps:
      - name: Check out the exact private carrier without persisted credentials
        timeout-minutes: 1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          path: admin
          persist-credentials: false
      - name: Require explicit primary authorization and an exact Backend19 commit
        id: target
        timeout-minutes: 1
        shell: bash
        run: |
          python3 -B - <<'PY'
          import json, os, re
          from pathlib import Path
          value = json.loads(Path('admin/ci/backend19-summary-generation.request.json').read_text())
          sha = value.get('backend_sha', '')
          if value.get('authorization') != 'BACKEND19_ONE_TARGETED_BATCH_AUTHORIZED' or not re.fullmatch('[0-9a-f]{40}', sha) or sha == '0' * 40:
              raise SystemExit('Unbound or unauthorized Backend19 request; no Backend checkout/build permitted')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('sha=' + sha + '\n')
          PY
      - name: Check out only the exact public Backend19 target
        timeout-minutes: 1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: kira-manga/Kira-backend
          ref: ${{ steps.target.outputs.sha }}
          path: backend
          persist-credentials: false
      - name: Set up the existing Java 21 toolchain
        timeout-minutes: 2
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run two source-summary classes (15 tests) with main/test Ktlint and Detekt once
        id: validation
        timeout-minutes: 35
        env:
          BACKEND19_RUN: ${{ runner.temp }}/backend19-summary-generation-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 -B admin/ci/backend19-summary-generation.py
      - name: Retain raw private reports; missing evidence is not a passing test result
        if: always() && steps.validation.outcome != 'skipped'
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend19-summary-generation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backend19-summary-generation-${{ github.run_id }}-${{ github.run_attempt }}/reports/
          retention-days: 3
          if-no-files-found: error
