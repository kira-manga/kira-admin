name: App8 Apple runtime readiness only (public metadata)

on:
  push:
    branches: [validation/app8-readiness-20260916-01]
    paths: [ci/app8-apple-readiness.request.json]

permissions:
  contents: read

concurrency:
  group: app8-apple-readiness
  cancel-in-progress: false

jobs:
  runtime-readiness:
    if: >-
      ${{ github.repository == 'kira-manga/kira-admin' &&
          github.event.repository.private == false && github.event_name == 'push' &&
          github.ref == 'refs/heads/validation/app8-readiness-20260916-01' &&
          github.run_attempt == 1 && github.workflow_sha == github.sha }}
    runs-on: macos-26
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Observe installed runtime once; no native probe
        id: readiness
        env:
          APP8_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          APP8_READINESS_RUN: ${{ runner.temp }}/app8-apple-readiness-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 -B ci/app8-apple-readiness.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.readiness.outcome != 'skipped'
        with:
          name: app8-apple-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/app8-apple-readiness-${{ github.run_id }}-${{ github.run_attempt }}/reports/tool-identities.json
            ${{ runner.temp }}/app8-apple-readiness-${{ github.run_id }}-${{ github.run_attempt }}/reports/readiness.json
            ${{ runner.temp }}/app8-apple-readiness-${{ github.run_id }}-${{ github.run_attempt }}/reports/commands.json
            ${{ runner.temp }}/app8-apple-readiness-${{ github.run_id }}-${{ github.run_attempt }}/reports/cleanup.json
            ${{ runner.temp }}/app8-apple-readiness-${{ github.run_id }}-${{ github.run_attempt }}/reports/*-xcode-version.log
            ${{ runner.temp }}/app8-apple-readiness-${{ github.run_id }}-${{ github.run_attempt }}/reports/*-sdk-version.log
            ${{ runner.temp }}/app8-apple-readiness-${{ github.run_id }}-${{ github.run_attempt }}/reports/*-sdk-path.log
            ${{ runner.temp }}/app8-apple-readiness-${{ github.run_id }}-${{ github.run_attempt }}/reports/*-sdk-build.log
            ${{ runner.temp }}/app8-apple-readiness-${{ github.run_id }}-${{ github.run_attempt }}/reports/*-runtimes.log
          retention-days: 1
          if-no-files-found: error
