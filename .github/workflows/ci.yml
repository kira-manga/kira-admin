name: App29 Admin moderation controls focused verification (no deployment)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app29-admin-moderation-editor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRODUCT_SHA: bb826f6b5ce5ce3a99bd66a54a555bae532634e9
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=1536
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: bb826f6b5ce5ce3a99bd66a54a555bae532634e9
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: One locked install, focused component tests and Admin build
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          export npm_config_cache="$RUNNER_TEMP/kira-moderation-editor-npm"
          export EVIDENCE="$RUNNER_TEMP/kira-moderation-editor-evidence"
          mkdir -p "$EVIDENCE"
          printf '%s\n' "$PRODUCT_SHA" > "$EVIDENCE/product-sha.txt"
          git ls-files -z | xargs -0 sha256sum > "$EVIDENCE/source-before.sha256"
          cp next-env.d.ts "$EVIDENCE/next-env.before"
          worker=''
          cleanup() {
            outcome=$?
            set +e
            if [ -n "$worker" ]; then
              kill -TERM -- "-$worker" 2>/dev/null
              sleep 1
              kill -KILL -- "-$worker" 2>/dev/null
              wait "$worker" 2>/dev/null
              ps -eo pgid,pid,comm | awk -v group="$worker" '$1 == group' > "$EVIDENCE/owned-processes-after.txt"
            fi
            rm -rf node_modules .next tsconfig.tsbuildinfo "$npm_config_cache"
            if [ -s "$EVIDENCE/owned-processes-after.txt" ] || [ -e node_modules ] || [ -e .next ] || [ -e tsconfig.tsbuildinfo ] || [ -e "$npm_config_cache" ]; then
              printf 'FAILED: owned process/output remains.\n' > "$EVIDENCE/cleanup.txt"
              outcome=1
            else
              printf 'PASS: owned processes absent; owned outputs/cache removed.\n' > "$EVIDENCE/cleanup.txt"
            fi
            free -h > "$EVIDENCE/resources-after.txt"
            df -h . "$RUNNER_TEMP" >> "$EVIDENCE/resources-after.txt"
            exit "$outcome"
          }
          trap cleanup EXIT
          free -h > "$EVIDENCE/resources-before.txt"
          df -h . "$RUNNER_TEMP" >> "$EVIDENCE/resources-before.txt"
          setsid taskset -c 0,1 bash -c 'npm ci --no-audit --no-fund && npm run lint && npm run typecheck && npm test -- src/components/complaint-moderation-editor.test.tsx && npm run build' > "$EVIDENCE/verify.log" 2>&1 &
          worker=$!
          set +e
          wait "$worker"
          status=$?
          set -e
          printf '%s\n' "$status" > "$EVIDENCE/verify-exit.txt"
          tail -n 100 "$EVIDENCE/verify.log"
          # Next may add this generated type import; no other source mutation is accepted.
          python3 - <<'PY'
          import os, pathlib
          e = pathlib.Path(os.environ['EVIDENCE'])
          p = pathlib.Path('next-env.d.ts')
          before = (e / 'next-env.before').read_bytes()
          after = p.read_bytes()
          (e / 'next-env.after').write_bytes(after)
          assert after == before or after.replace(b'import "./.next/types/root-params.d.ts";\n', b'', 1) == before
          p.write_bytes(before)
          PY
          sha256sum --check --quiet "$EVIDENCE/source-before.sha256"
          git diff --exit-code
          exit "$status"
      - name: Retain small verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: app29-admin-moderation-editor-verification
          path: ${{ runner.temp }}/kira-moderation-editor-evidence/
          if-no-files-found: error
          retention-days: 1
