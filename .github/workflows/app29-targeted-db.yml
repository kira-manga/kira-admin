name: App29 targeted PostgreSQL validation (private)
on:
  push:
    branches: [remediation/app-29-backend-complaints]
    paths:
      - .github/workflows/app29-targeted-db.yml
      - ci/app29-targeted-db.py
      - ci/app29_owned_children.py
      - ci/app29-targeted-db.target
permissions:
  contents: read
concurrency:
  group: app29-private-db-${{ github.ref }}
  cancel-in-progress: false
jobs:
  targeted-db:
    if: github.event.repository.private == true
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: admin
          persist-credentials: false
      - name: Require an exact reviewed public backend commit
        id: target
        shell: bash
        run: |
          sha=$(cat admin/ci/app29-targeted-db.target)
          [[ "$sha" =~ ^[0-9a-f]{40}$ && "$sha" != 0000000000000000000000000000000000000000 ]] || { echo '::error::Replace the target placeholder with the reviewed public backend SHA'; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: kira-manga/Kira-backend
          ref: ${{ steps.target.outputs.sha }}
          path: backend
          persist-credentials: false
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run only the real-DB lifecycle class
        id: validation
        env:
          APP29_RUN: ${{ runner.temp }}/app29-db-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 -B admin/ci/app29-targeted-db.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.validation.outcome != 'skipped'
        with:
          name: app29-db-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/app29-db-${{ github.run_id }}-${{ github.run_attempt }}/reports/*.log
            ${{ runner.temp }}/app29-db-${{ github.run_id }}-${{ github.run_attempt }}/reports/*.xml
          retention-days: 3
          if-no-files-found: error
